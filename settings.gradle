pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "smartsync-plugins"

// The plugin interface, and every plugin built against it as a project module (no vendored copy).
include ':plugin-api'
include ':homeassistant'
include ':healthconnect'
include ':trmnl'
include ':tasker'
