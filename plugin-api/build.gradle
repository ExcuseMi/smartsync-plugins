plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.compose.compiler)
    id 'maven-publish'
    // The public interface is dumped to api/plugin-api.api; apiCheck (CI) fails on any change to it that is not in the dump.
    alias(libs.plugins.binary.compatibility.validator)
}

// The interface version: also PluginApi.VERSION (PluginApiVersionTest keeps both the same). Tag: plugin-api-v<version>.
version = '0.1.0'
group = 'com.github.ExcuseMi.smartsync-plugins'

android {
    namespace = 'org.avmedia.smartsync.plugin.api'
    compileSdk = 37

    defaultConfig {
        minSdk = 26
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    buildFeatures {
        compose = true
    }

    testOptions {
        unitTests {
            all { testLogging { exceptionFormat = 'full'; events 'failed' } }
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    // Only what the interface names: Context (Android) and @Composable.
    api(platform(libs.androidx.compose.bom))
    api(libs.compose.runtime)
    // ImageVector for a plugin's icon.
    api(libs.compose.ui)
    testImplementation(libs.junit)
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = project.group
                artifactId = 'plugin-api'
                version = project.version
            }
        }
    }
}
