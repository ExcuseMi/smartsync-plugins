plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.compose.compiler)
    id 'maven-publish'
}

// The plugin version. Tag: healthconnect-v<version>.
version = '0.1.0'
group = 'com.github.ExcuseMi.smartsync-plugins'

android {
    namespace = 'org.avmedia.smartsync.plugin.healthconnect'
    compileSdk = 37

    defaultConfig {
        minSdk = 26
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    buildFeatures {
        compose = true
    }

    lint {
        warningsAsErrors = false
        abortOnError = true
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            all { testLogging { exceptionFormat = 'full'; events 'failed' } }
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    // The plugin sees the app only through the plugin interface (PluginBoundaryTest keeps it so).
    api(project(':plugin-api'))
    implementation(libs.health.connect)
    implementation(platform(libs.androidx.compose.bom))
    implementation(libs.compose.ui)
    implementation(libs.material3)
    implementation(libs.activity.compose)
    implementation(libs.kotlinx.coroutines.android)
    implementation(libs.timber)
    testImplementation(libs.junit)
    testImplementation(libs.kotlinx.coroutines.test)
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = project.group
                artifactId = 'healthconnect'
                version = project.version
            }
        }
    }
}
