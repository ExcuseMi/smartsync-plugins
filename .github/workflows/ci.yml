name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Commit messages carry no AI lines or em-dashes
        run: tools/check-commits.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (plugin-api and every plugin)
        run: ./gradlew --continue testDebugUnitTest

      - name: plugin-api public interface matches its dump (binary compatibility)
        run: ./gradlew :plugin-api:apiCheck

      - name: The dump of the interface as built, for a deliberate change (commit plugin-api/api/)
        if: failure()
        run: ./gradlew :plugin-api:apiDump

      - name: Upload the interface dump
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-api-dump
          path: plugin-api/api/
          if-no-files-found: ignore

      - name: Lint, release build and local publication of every module
        run: ./gradlew --continue lintDebug assembleRelease publishToMavenLocal

      - name: TRMNL payload size of a full day
        if: always()
        run: |
          f=trmnl/build/test-results/testDebugUnitTest/TEST-org.avmedia.smartsync.plugin.trmnl.PayloadTest.xml
          [ -f "$f" ] && grep -o 'full day request: [0-9]* bytes' "$f" || true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            */build/reports/
            */build/test-results/
          if-no-files-found: ignore

      - name: Upload the plugin libraries
        uses: actions/upload-artifact@v4
        with:
          name: plugins-aar
          path: "*/build/outputs/aar/*-release.aar"
