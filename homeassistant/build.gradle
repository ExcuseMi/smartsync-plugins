plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.compose.compiler)
    id 'maven-publish'
}

// Tag v<version>. HomeAssistantPlugin.VERSION states the same (RepoGuardTest).
version = '0.1.0'
group = 'com.github.ExcuseMi'

android {
    namespace = 'org.avmedia.smartsync.plugin.homeassistant'
    compileSdk = 37

    defaultConfig {
        minSdk = 26
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    buildFeatures {
        compose = true
    }

    lint {
        warningsAsErrors = false
        abortOnError = true
    }

    testOptions {
        unitTests {
            all { testLogging { exceptionFormat = 'full'; events 'failed' } }
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    // The host app provides the interface at run time: compile against it, never ship a second copy.
    compileOnly(project(':plugin-api'))
    testImplementation(project(':plugin-api'))

    implementation(libs.paho.mqttv3)
    implementation(libs.okhttp)
    implementation(libs.timber)
    implementation(platform(libs.androidx.compose.bom))
    implementation(libs.compose.runtime)
    implementation(libs.compose.ui)
    implementation(libs.compose.foundation)
    implementation(libs.material3)
    implementation(libs.kotlinx.coroutines.core)

    testImplementation(libs.junit)
    testImplementation(libs.kotlinx.coroutines.test)
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = project.group
                artifactId = 'smartsync-homeassistant-plugin'
                version = project.version
            }
        }
    }
}
